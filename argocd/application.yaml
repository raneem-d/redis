apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raneem-d/redis.git
    targetRevision: main
    path: helm/redis-api
    helm:
      releaseName: redis-api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true